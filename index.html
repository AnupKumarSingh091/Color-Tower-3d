<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stack Ball 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a237e radial-gradient(circle at 50% 30%,#7986cb,#3949ab,#1a237e);font-family:sans-serif}
#c{position:absolute;top:0;left:0;width:100%;height:100%;display:block;z-index:1}
.top-ui{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:20;pointer-events:none;color:#fff}
.lvl-wrap{display:flex;align-items:center;width:230px}
.lvl-badge{width:32px;height:32px;background:#007bff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.lvl-line-bg{flex:1;height:8px;background:rgba(255,255,255,0.35);margin:0 -4px;border-radius:4px;overflow:hidden}
.lvl-fill{width:0%;height:100%;background:#007bff;transition:width .08s}
#score{font-size:48px;font-weight:900;margin-top:2px}
#noads{position:absolute;bottom:85px;right:18px;background:rgba(255,255,255,0.22);color:#fff;border:1.5px solid #fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold;z-index:50;cursor:pointer}
.left-p{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:50}
.ib{width:44px;height:44px;background:rgba(255,255,255,0.25);border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.ib svg{width:22px;height:22px;fill:#fff}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(26,35,126,.97);border:2px solid #5c6bc0;padding:16px;border-radius:16px;color:#fff;z-index:100;display:none;flex-direction:column;gap:8px;width:280px}
.m-tit{text-align:center;font-weight:900;border-bottom:1px solid #7986cb;padding-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold}
.btn{background:#007bff;border:none;color:#fff;padding:5px 10px;border-radius:8px;font-weight:bold;cursor:pointer}
.cl-btn{background:#ff4757;color:#fff;border:none;padding:6px;border-radius:10px;font-weight:900;cursor:pointer}

/* CLEAR VISIBLE TAP BADGE OVER WHITE PILLAR */
#msg-box{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;z-index:60;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#msg-title{font-size:26px;font-weight:900;background:rgba(0,0,0,0.65);padding:10px 22px;border-radius:30px;border:2px solid #fff;text-shadow:0 2px 8px rgba(0,0,0,0.8);letter-spacing:1px}
#msg-sub{font-size:13px;font-weight:bold;margin-top:8px;color:#ffeb3b;background:rgba(0,0,0,0.6);padding:4px 12px;border-radius:12px;display:none}
#retry-btn{pointer-events:auto;background:#ff5722;color:#fff;font-size:16px;font-weight:bold;padding:10px 24px;border-radius:24px;border:none;cursor:pointer;display:none;margin-top:10px}

.bot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;pointer-events:none;color:#fff;font-size:11px}
#ad{width:320px;height:50px;background:rgba(0,0,0,0.25);border-radius:6px 6px 0 0;pointer-events:auto}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div class="top-ui">
  <div class="lvl-wrap"><div class="lvl-badge" id="l-c">1</div><div class="lvl-line-bg"><div class="lvl-fill" id="l-p"></div></div><div class="lvl-badge" id="l-n">2</div></div>
  <div id="score">0</div>
</div>
<div class="left-p">
  <div class="ib" onclick="oM('m-info')"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></div>
  <div class="ib" onclick="oM('m-rate')"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></div>
  <div class="ib" onclick="openLead()"><svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg></div>
  <div class="ib" onclick="openSet()"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
</div>
<div id="noads" onclick="oM('m-pay')">NO ADS</div>

<div class="modal" id="m-info">
  <div class="m-tit">GAME RULES</div>
  <div style="font-size:12px;line-height:1.4">Hold to smash safe rings.<br>Black slice par hit = Game Over!<br>Level 5+ par out hue toh Level 1 reset.</div>
  <button class="cl-btn" onclick="cM('m-info')">CLOSE</button>
</div>

<div class="modal" id="m-rate">
  <div class="m-tit">RATE GAME</div>
  <div style="display:flex;justify-content:center;gap:6px;font-size:26px;cursor:pointer">
    <span onclick="sR(1)">★</span><span onclick="sR(2)">★</span><span onclick="sR(3)">★</span><span onclick="sR(4)">★</span><span onclick="sR(5)">★</span>
  </div>
  <div id="r-fb" style="text-align:center;font-size:11px;color:#ffeaa7;min-height:26px"></div>
  <button class="cl-btn" onclick="cM('m-rate')">CLOSE</button>
</div>

<div class="modal" id="m-set">
  <div class="m-tit">SETTINGS</div>
  <div class="row">Name:<input id="p-inp" maxlength="12" style="width:100px;padding:3px;text-align:center"></div>
  <button class="btn" id="s-sv" onclick="svN()">SAVE NAME</button>
  <div class="row">Music & Audio:<button class="btn" id="s-au" onclick="tgS()">ON</button></div>
  <div class="row">Reset:<button class="btn" style="background:#e74c3c" onclick="rst()">RESET</button></div>
  <button class="cl-btn" onclick="cM('m-set')">CLOSE</button>
</div>

<div class="modal" id="m-pay">
  <div class="m-tit">REMOVE ADS</div>
  <div style="text-align:center;font-size:13px">Premium ad-free game:<br><b style="color:#2ed573;font-size:16px">₹79 / $0.99</b></div>
  <button class="btn" style="background:#2ed573;padding:8px" onclick="pay()">PAY NOW</button>
  <button class="cl-btn" onclick="cM('m-pay')">CANCEL</button>
</div>

<div class="modal" id="m-lead">
  <div class="m-tit">REAL LEADERBOARD</div>
  <div id="l-box" style="display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto"></div>
  <button class="cl-btn" onclick="cM('m-lead')">CLOSE</button>
</div>

<div id="msg-box">
  <div id="msg-title">TAP TO PLAY</div>
  <div id="msg-sub">RESET TO LEVEL 1</div>
  <button id="retry-btn" onclick="retry()">TAP TO RETRY</button>
</div>
<div class="bot"><div>Copyright © Anup Kumar</div><div id="ad"></div></div>

<script>
let pN="Player_"+Math.floor(100+Math.random()*900);
let pI="ID-"+Math.floor(1000+Math.random()*9000);
try{
  pN=localStorage.getItem('s_n')||pN;
  pI=localStorage.getItem('s_i')||pI;
  localStorage.setItem('s_n',pN);
  localStorage.setItem('s_i',pI);
}catch(e){}

const Snd={
  ctx:null,tm:null,en:true,
  init(){
    try{
      if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();
      if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    }catch(e){}
  },
  bgm(){
    this.init();
    if(!this.en||this.tm)return;
    const chords=[[261,329,392],[220,261,329],[174,220,261],[196,246,293]];
    let idx=0;
    this.tm=setInterval(()=>{
      if(!this.en||!this.ctx)return;
      if(this.ctx.state==='suspended'){this.ctx.resume();return;}
      let chord=chords[idx%chords.length];
      chord.forEach((f,i)=>{
        try{
          let o=this.ctx.createOscillator(),g=this.ctx.createGain();
          o.type='sine';
          o.frequency.setValueAtTime(f,this.ctx.currentTime+i*0.06);
          g.gain.setValueAtTime(0.025,this.ctx.currentTime+i*0.06);
          g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+i*0.06+0.42);
          o.connect(g);g.connect(this.ctx.destination);
          o.start(this.ctx.currentTime+i*0.06);
          o.stop(this.ctx.currentTime+i*0.06+0.42);
        }catch(e){}
      });
      idx++;
    },450);
  },
  stop(){if(this.tm){clearInterval(this.tm);this.tm=null;}},
  b(f,t,d,vol=0.2){
    if(!this.en)return;
    this.init();
    try{
      let o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=t;
      o.frequency.setValueAtTime(f,this.ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(30,this.ctx.currentTime+d);
      g.gain.setValueAtTime(vol,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d);
      o.connect(g);g.connect(this.ctx.destination);
      o.start();o.stop(this.ctx.currentTime+d);
    }catch(e){}
  }
};

let level=1,broken=0,state='WAIT',hold=false,rings=[],frags=[],ballV=0,totalFloors=20,rem=20,SP=1.35;
const cols=[0xffd32a,0x00d2d3,0xff4757,0x2ed573,0x9b59b6];
const cvs=document.getElementById('c'),ren=new THREE.WebGLRenderer({canvas:cvs,antialias:false,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,1.25));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,0.1,120);
sc.add(new THREE.AmbientLight(0xffffff,0.95));
let dl=new THREE.DirectionalLight(0xffffff,0.5);dl.position.set(10,25,15);sc.add(dl);
let pil=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,280,12),new THREE.MeshLambertMaterial({color:0xffffff}));pil.position.y=-35;sc.add(pil);
let ball=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,12),new THREE.MeshLambertMaterial({color:0x0084ff}));sc.add(ball);
let base=new THREE.Mesh(new THREE.CylinderGeometry(4.8,4.8,1.2,8),new THREE.MeshLambertMaterial({color:0x55efc4}));base.position.y=-0.6;sc.add(base);
let tg=new THREE.Group();sc.add(tg);
const rc=new THREE.Raycaster(),rO=new THREE.Vector3(),rD=new THREE.Vector3(0,-1,0),STEP=Math.PI/4,dMat=new THREE.MeshLambertMaterial({color:0x111111});

function mkG(a){
  const s=new THREE.Shape();
  for(let i=0;i<=4;i++){let t=(i/4)*a;s[i?'lineTo':'moveTo'](Math.cos(t)*4.4,Math.sin(t)*4.4)}
  for(let i=4;i>=0;i--){let t=(i/4)*a;s.lineTo(Math.cos(t)*1.68,Math.sin(t)*1.68)}
  s.closePath();let g=new THREE.ExtrudeGeometry(s,{depth:0.65,bevelEnabled:false});g.rotateX(Math.PI/2);return g;
}
const sGeo=mkG(STEP-0.04);

function buildLevel(){
  rings.forEach(r=>tg.remove(r.g));rings=[];frags.forEach(f=>sc.remove(f.m));frags=[];
  totalFloors=10+(level*10);rem=totalFloors;broken=0;
  let dCnt=level>4?2:1,sMat=new THREE.MeshLambertMaterial({color:cols[(level-1)%cols.length]});
  for(let i=0;i<totalFloors;i++){
    let g=new THREE.Group(),sls=[],ds=new Set();g.position.y=i*SP;
    while(ds.size<dCnt)ds.add(Math.floor(Math.random()*8));
    for(let s=0;s<8;s++){
      let isD=ds.has(s),m=new THREE.Mesh(sGeo,isD?dMat:sMat);m.rotation.y=s*STEP;m.userData={d:isD};g.add(m);sls.push(m);
    }
    g.rotation.y=i*0.35;tg.add(g);rings.push({g,y:i*SP,sls});
  }
  document.getElementById('l-c').innerText=level;document.getElementById('l-n').innerText=level+1;
  document.getElementById('l-p').style.width="0%";document.getElementById('score').innerText=0;
  let sy=(totalFloors-1)*SP+1.2;ball.position.set(0,sy,3.0);ballV=0;
  cam.position.set(0,sy+7.5,19.5);cam.lookAt(0,sy+0.5,0);
  state='WAIT';document.getElementById('msg-title').innerText="TAP TO PLAY";
  document.getElementById('msg-title').style.display='block';document.getElementById('msg-sub').style.display='none';document.getElementById('retry-btn').style.display='none';
  saveScoreRecord();
}

function shatter(r){
  tg.remove(r.g);Snd.b(160,'triangle',0.1,0.22);
  if(frags.length<10){
    for(let s=0;s<4;s++){
      let f=r.sls[s*2].clone();f.position.copy(r.g.position);f.rotation.copy(r.g.rotation);f.rotation.y+=r.sls[s*2].rotation.y;
      sc.add(f);let a=f.rotation.y;frags.push({m:f,v:new THREE.Vector3(Math.cos(a)*0.18,0.1,Math.sin(a)*0.18),rv:new THREE.Vector3(0.08,0.08,0.08),l:0.6});
    }
  }
  rem--;broken++;document.getElementById('score').innerText=broken;
  document.getElementById('l-p').style.width=(((totalFloors-rem)/totalFloors)*100)+"%";
}

function gOver(sy){
  state='OVER';hold=false;ballV=0;if(sy!==undefined)ball.position.y=sy;
  Snd.b(100,'sawtooth',0.4,0.3);
  document.getElementById('msg-title').innerText="GAME OVER";document.getElementById('msg-title').style.display='block';
  if(level>=5){document.getElementById('msg-sub').innerText=`OUT AT LVL ${level}! RESET TO LVL 1`;document.getElementById('msg-sub').style.display='block';}
  document.getElementById('retry-btn').style.display='block';
  saveScoreRecord();
}

function retry(){if(level>=5)level=1;buildLevel();}

function loop(){
  requestAnimationFrame(loop);tg.rotation.y+=0.008;
  if(state==='PLAY'){
    ballV=hold?-0.22:ballV-0.016;ball.position.y+=ballV;
    if(rings.length>0){
      let cr=rings[rings.length-1],cy=cr.y+0.65;
      if(ball.position.y<=cy){
        rO.set(ball.position.x,ball.position.y+0.1,ball.position.z);rc.set(rO,rD);rc.far=0.9;
        let hits=rc.intersectObjects(cr.sls,false),isD=hits.length>0&&hits[0].object.userData.d;
        if(hold){
          if(isD){gOver(cy+0.05);return;}
          else{shatter(cr);rings.pop();ball.position.y=cy;if(rings.length===0){level=Math.min(level+1,100);buildLevel();return;}}
        }else{ball.position.y=cy+0.02;ballV=0.22;Snd.b(300,'sine',0.08,0.15);}
      }
    }
  }else if(state==='WAIT'){
    ballV-=0.016;ball.position.y+=ballV;let fy=rings.length>0?(rings[rings.length-1].y+0.65):0.65;
    if(ball.position.y<=fy){ball.position.y=fy;ballV=0.22;Snd.b(300,'sine',0.08,0.15);}
  }
  let ty=ball.position.y+7.5;cam.position.y+=(ty-cam.position.y)*0.08;cam.lookAt(0,ball.position.y+0.5,0);
  for(let i=frags.length-1;i>=0;i--){let f=frags[i];f.m.position.add(f.v);f.m.rotation.x+=f.rv.x;f.l-=0.08;if(f.l<=0){sc.remove(f.m);frags.splice(i,1);}}
  ren.render(sc,cam);
}

function res(){
  let w=window.innerWidth,h=window.innerHeight;
  if(w&&h){ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}
}
window.addEventListener('resize',res);

window.addEventListener('pointerdown',e=>{
  Snd.init();
  if(e.target.closest('.left-p')||e.target.closest('.modal')||e.target.id==='noads'||e.target.id==='retry-btn')return;
  Snd.bgm();
  if(state==='WAIT'){state='PLAY';hold=true;document.getElementById('msg-title').style.display='none';document.getElementById('msg-sub').style.display='none';}
  else if(state==='PLAY')hold=true;
});
window.addEventListener('pointerup',()=>hold=false);
window.addEventListener('pointercancel',()=>hold=false);

function closeAllModals(){
  document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
}
function oM(id){
  closeAllModals();
  document.getElementById(id).style.display='flex';
}
function cM(id){document.getElementById(id).style.display='none';}

function sR(st){
  const r={1:"We are sorry for your inconvenience",2:"Just sorry",3:"Sorry for smaller issues, thanks for playing with us",4:"Hope you love this game",5:"Thanks for play our game"};
  document.getElementById('r-fb').innerText=r[st];
}
function openSet(){
  document.getElementById('p-inp').value=pN;
  oM('m-set');
}
function svN(){
  let v=document.getElementById('p-inp').value.trim();
  if(v){
    let oldName = pN;
    pN=v;
    try{localStorage.setItem('s_n',pN);}catch(e){}
    saveScoreRecord(oldName);
    let b=document.getElementById('s-sv');
    b.innerText="SAVED ✓";
    setTimeout(()=>b.innerText="SAVE NAME",1000);
  }
}
function tgS(){
  Snd.en=!Snd.en;
  document.getElementById('s-au').innerText=Snd.en?'ON':'OFF';
  if(!Snd.en)Snd.stop();else{Snd.init();Snd.bgm();}
}
function rst(){level=1;cM('m-set');buildLevel();}
function pay(){cM('m-pay');document.querySelector('.bot').style.display='none';document.getElementById('noads').style.display='none';}

function saveScoreRecord(oldName){
  let list=[];
  try{list=JSON.parse(localStorage.getItem('s_lb')||'[]');}catch(e){}
  let map=new Map();
  list.forEach(item=>{
    if(item && item.n){
      let key = item.n.trim().toLowerCase();
      if(!map.has(key) || item.l > map.get(key).l){
        map.set(key, item);
      }
    }
  });
  if(oldName && oldName.trim().toLowerCase() !== pN.trim().toLowerCase()){
    map.delete(oldName.trim().toLowerCase());
  }
  let myKey = pN.trim().toLowerCase();
  let existing = map.get(myKey);
  let bestLvl = existing ? Math.max(existing.l, level) : level;
  map.set(myKey, { n: pN, i: pI, l: bestLvl });
  try{localStorage.setItem('s_lb', JSON.stringify(Array.from(map.values())));}catch(e){}
}

function openLead(){
  saveScoreRecord();
  let list=[];
  try{list=JSON.parse(localStorage.getItem('s_lb')||'[]');}catch(e){}
  let map=new Map();
  list.forEach(item=>{
    if(item && item.n){
      let key = item.n.trim().toLowerCase();
      if(!map.has(key) || item.l > map.get(key).l){
        map.set(key, item);
      }
    }
  });
  let cleaned=Array.from(map.values()).sort((a,b)=>b.l-a.l);
  let h="";
  cleaned.forEach((p,idx)=>{
    let isMe=(p.n.trim().toLowerCase()===pN.trim().toLowerCase());
    h+=`<div class="row" style="background:${isMe?'rgba(255,87,34,0.3)':'rgba(255,255,255,0.1)'};padding:4px 6px;border-radius:6px;border:${isMe?'1px solid #ff5722':'none'}">
      <span>#${idx+1} ${p.n}${isMe?' (You)':''}</span>
      <span style="font-size:10px;opacity:.7">${p.i}</span>
      <span>Lvl ${p.l}</span>
    </div>`;
  });
  document.getElementById('l-box').innerHTML=h;
  oM('m-lead');
}

setTimeout(()=>{res();buildLevel();loop();},100);
</script>
</body>
</html>
